<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231A1A1A' stroke-width='1'%3E%3Cline x1='4' y1='20' x2='20' y2='4'/%3E%3Cline x1='4' y1='4' x2='20' y2='20'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="creative-medium" content="interactive-prototype" />
    <title>LINE — 个人作品与资源站</title>
    <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Ma+Shan+Zheng&display=swap" />

    <!-- Tailwind CSS CDN (本地副本) -->
    <script src="assets/tailwindcss.js"></script>
    <script>
      if (typeof tailwind !== 'undefined') {
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                ink: 'var(--color-ink)',
                paper: 'var(--color-paper)',
                line: 'var(--color-line)',
                muted: 'var(--color-muted)',
                faint: 'var(--color-faint)',
              },
              fontFamily: {
                sans: ['"Noto Sans SC"', 'system-ui', 'sans-serif'],
                display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                calligraphy: ['"Ma Shan Zheng"', 'KaiTi', 'STKaiti', 'cursive'],
              },
              letterSpacing: {
                wide2: '0.2em',
                wide3: '0.35em',
              },
              transitionTimingFunction: {
                'line': 'cubic-bezier(0.22, 1, 0.36, 1)',
              },
            },
          },
        }
      }
    </script>

    <style>
      /* ===== 主题变量 ===== */
      :root {
        --color-ink: #1A1A1A;
        --color-paper: #FAFAFA;
        --color-line: #D4D4D4;
        --color-muted: #737373;
        --color-faint: #EDEDED;
        --color-overlay: rgba(250, 250, 250, 0.5);
        --color-backdrop: rgba(26, 26, 26, 0.8);
      }
      html[data-theme="dark"] {
        --color-ink: #E8E8E8;
        --color-paper: #0F0F0F;
        --color-line: #2A2A2A;
        --color-muted: #8A8A8A;
        --color-faint: #1A1A1A;
        --color-overlay: rgba(15, 15, 15, 0.6);
        --color-backdrop: rgba(0, 0, 0, 0.85);
      }

      html { scroll-behavior: smooth; }
      body {
        font-family: "Noto Sans SC", system-ui, sans-serif;
        font-weight: 300;
        background: var(--color-paper);
        color: var(--color-ink);
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.5s ease, color 0.5s ease;
        margin: 0;
        min-height: 100vh;
      }
      ::selection { background: var(--color-ink); color: var(--color-paper); }
      #root { min-height: 100vh; }

      /* 加载骨架 — 白屏时至少显示点什么 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-paper);
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #app-loading.hidden { opacity: 0; pointer-events: none; }
      #app-loading svg { animation: loadingPulse 1.6s ease-in-out infinite; }
      @keyframes loadingPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      /* 错误兜底 */
      #app-error {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--color-paper);
        z-index: 10000;
        padding: 24px;
      }
      #app-error.show { display: flex; }
      .error-box {
        max-width: 520px;
        width: 100%;
        border: 1px solid #ef4444;
        padding: 24px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        line-height: 1.6;
        color: #ef4444;
      }
      .error-box h2 {
        margin: 0 0 12px 0;
        font-size: 14px;
        font-weight: 500;
      }
      .error-box pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 12px;
        color: #374151;
      }

      /* 线条描绘动画 */
      .line-draw {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        transition: stroke-dashoffset 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .group:hover .line-draw { stroke-dashoffset: 0; }

      /* 水平线条从中心展开 */
      .line-expand-x { position: relative; }
      .line-expand-x::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 0;
        height: 1px;
        background: currentColor;
        transform: translateX(-50%);
        transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .line-expand-x:hover::after { width: 100%; }

      /* 四角线条装饰 hover 展开 */
      .corner-lines { position: relative; }
      .corner-lines::before,
      .corner-lines::after {
        content: '';
        position: absolute;
        width: 24px;
        height: 24px;
        border-color: var(--color-ink);
        border-style: solid;
        border-width: 0;
        transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }
      .corner-lines::before { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
      .corner-lines::after { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }
      .corner-lines:hover::before { width: 40px; height: 40px; }
      .corner-lines:hover::after { width: 40px; height: 40px; }

      /* 页面淡入 */
      .page-enter { animation: pageFadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes pageFadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* 元素逐次淡入上移 */
      .stagger > * {
        opacity: 0;
        transform: translateY(16px);
        animation: staggerUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .stagger > *:nth-child(1) { animation-delay: 0.05s; }
      .stagger > *:nth-child(2) { animation-delay: 0.12s; }
      .stagger > *:nth-child(3) { animation-delay: 0.19s; }
      .stagger > *:nth-child(4) { animation-delay: 0.26s; }
      .stagger > *:nth-child(5) { animation-delay: 0.33s; }
      .stagger > *:nth-child(6) { animation-delay: 0.40s; }
      .stagger > *:nth-child(7) { animation-delay: 0.47s; }
      .stagger > *:nth-child(8) { animation-delay: 0.54s; }
      @keyframes staggerUp {
        to { opacity: 1; transform: translateY(0); }
      }

      /* 弹窗动画 */
      .modal-backdrop-enter { animation: fadeIn 0.3s ease-out both; }
      .modal-content-enter { animation: modalIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes modalIn {
        from { opacity: 0; transform: scale(0.96); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* 细线流动 — 无限循环 */
      .line-flow {
        stroke-dasharray: 8 12;
        animation: lineFlow 3s linear infinite;
      }
      @keyframes lineFlow {
        from { stroke-dashoffset: 0; }
        to   { stroke-dashoffset: -40; }
      }

      /* 滚动条 */
      html::-webkit-scrollbar { width: 6px; }
      html::-webkit-scrollbar-track { background: var(--color-paper); }
      html::-webkit-scrollbar-thumb { background: var(--color-line); }

      /* 首页视频背景 */
      .video-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }
      .video-overlay {
        position: absolute;
        inset: 0;
        background: var(--color-overlay);
        backdrop-filter: blur(2px);
        z-index: 1;
        transition: background-color 0.5s ease;
      }

      /* 编程卡片标签 */
      .tag-pill {
        border: 1px solid var(--color-line);
        color: var(--color-muted);
        padding: 2px 10px;
        font-size: 11px;
        letter-spacing: 0.05em;
        transition: all 0.3s ease;
      }
      .group:hover .tag-pill {
        border-color: var(--color-ink);
        color: var(--color-ink);
      }

      /* 主题/语言切换按钮通用 */
      .icon-btn {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--color-line);
        color: var(--color-muted);
        transition: all 0.3s ease;
        cursor: pointer;
        background: transparent;
      }
      .icon-btn:hover {
        border-color: var(--color-ink);
        color: var(--color-ink);
      }

      /* nav 透明度 — 确保导航立即可见 */
      header { background-color: var(--color-paper); }
    </style>
  </head>
  <body>
    <!-- 加载骨架：Babel 转译期间显示 -->
    <div id="app-loading">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" strokeWidth="1" style="color: var(--color-muted);">
        <line x1="5" y1="35" x2="35" y2="5" />
        <line x1="5" y1="5" x2="35" y2="35" />
      </svg>
    </div>

    <!-- 错误兜底：JS 报错时显示 -->
    <div id="app-error">
      <div class="error-box">
        <h2>⚠ 页面加载出错 / Page failed to load</h2>
        <pre id="app-error-message">—</pre>
      </div>
    </div>

    <div id="root"></div>

    <!--
      脚本全部放在 body 末尾，保证：
      1. DOM 已解析完毕
      2. 按依赖顺序加载：React → router → i18n/theme → Babel → App
      3. Babel 加载时能扫描到前面的所有 text/babel 脚本
    -->
    <!-- 核心库先加载（必须第一个） -->
    <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

    <!-- 依赖 React 的模块（内部用懒加载 React，所以脚本顺序可以在前） -->
    <script src="src/simple-router.js"></script>
    <script src="src/i18n.js"></script>
    <script src="src/theme.js"></script>

    <!-- 全局错误捕获（尽早安装） -->
    <script>
      (function() {
        window.__appErrors = []
        window.addEventListener('error', function(e) {
          window.__appErrors.push(e.message + ' (' + e.filename + ':' + e.lineno + ')')
        })
        window.addEventListener('unhandledrejection', function(e) {
          window.__appErrors.push('Unhandled: ' + (e.reason && e.reason.message || e.reason))
        })
        function showError(msg) {
          var el = document.getElementById('app-error')
          var msgEl = document.getElementById('app-error-message')
          var loading = document.getElementById('app-loading')
          if (loading) loading.style.display = 'none'
          if (el) el.classList.add('show')
          if (msgEl) msgEl.textContent = msg
          console.error('[App Init Error]', msg)
        }
        window.__showAppError = showError

        // 依赖健康检查 — React 必须已加载
        var missing = []
        if (typeof React === 'undefined') missing.push('React')
        if (typeof ReactDOM === 'undefined') missing.push('ReactDOM')
        if (typeof SimpleRouter === 'undefined') missing.push('SimpleRouter')
        if (typeof I18nProvider === 'undefined') missing.push('I18nProvider')
        if (typeof ThemeProvider === 'undefined') missing.push('ThemeProvider')
        if (missing.length > 0) {
          showError('Missing dependencies: ' + missing.join(', ') +
            '\n\n请检查网络连接，这些脚本未成功加载。' +
            '\nPlease check your network connection.')
        }
        window.__appDepsCheck = { missing: missing }
      })()
    </script>

    <!-- Babel — 必须在所有依赖之后、App.jsx 之前 -->
    <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

    <!-- 应用入口 — Babel 会扫描到此脚本并转译执行 -->
    <script type="text/babel" data-presets="react" src="src/App.jsx"></script>

    <!-- 渲染完成后隐藏 loading -->
    <script>
      // 轮询检测 root 是否有内容
      (function() {
        var root = document.getElementById('root')
        var loading = document.getElementById('app-loading')
        var checks = 0
        var maxChecks = 100 // 最多等 ~10 秒
        var timer = setInterval(function() {
          checks++
          if (root && root.children.length > 0) {
            if (loading) loading.classList.add('hidden')
            clearInterval(timer)
            setTimeout(function() {
              if (loading) loading.style.display = 'none'
            }, 500)
          } else if (checks >= maxChecks) {
            clearInterval(timer)
            // 10秒了还没渲染，显示错误
            var errs = window.__appErrors || []
            var msg = 'React 渲染超时 / React render timeout'
            if (errs.length) msg += '\n\nErrors:\n' + errs.join('\n')
            var errBox = document.getElementById('app-error')
            var msgEl = document.getElementById('app-error-message')
            if (loading) loading.style.display = 'none'
            if (errBox) errBox.classList.add('show')
            if (msgEl) msgEl.textContent = msg
          }
        }, 100)
      })()
    </script>
  </body>
</html>
